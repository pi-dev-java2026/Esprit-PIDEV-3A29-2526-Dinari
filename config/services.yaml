parameters:
    uploads_dir: '%kernel.project_dir%/public/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\StripeService:
        arguments:
            $secretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Service\OtpService:
        arguments:
            $resendApiKey: '%env(RESEND_API_KEY)%'

    App\Controller\Client\RdvController:
        arguments:
            $resendApiKey: '%env(RESEND_API_KEY)%'

    App\Service\RecaptchaService:
        arguments:
            $secretKey: '%env(RECAPTCHA_SECRET_KEY)%'

    App\Service\LocalAudioService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ReclamationClassifierService:
        arguments:
            $projectDir: '%kernel.project_dir%'